group = nu.entropy.smiv
version = 1.0.0

# Local PhpStorm installation used as the target platform (no download).
platformLocalPath = /Applications/PhpStorm.app
sinceBuild = 262

# Use the Kotlin stdlib bundled with the IDE -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
# The build cache restored stale test classes after a Kotlin `const` changed; the project is small, so leave it off.
org.gradle.caching = false
